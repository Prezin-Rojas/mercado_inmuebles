
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Inmuebles!</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/2d35188f5a.js" crossorigin="anonymous"></script>
    <style>
    .formulario-proyecto {
        width: 100%;
        max-width: 650px;
        margin: 0 auto;
    }

    .formulario-proyecto p {
        margin-bottom: 1rem;
    }

    .formulario-proyecto label {
        display: block;
        margin-bottom: 0.35rem;
        font-weight: 600;
    }

    .formulario-proyecto input,
    .formulario-proyecto select,
    .formulario-proyecto textarea {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
    }

    .formulario-proyecto textarea {
        min-height: 110px;
    }

    .formulario-proyecto .helptext {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.875rem;
    }
</style>
</head>
<body class="d-flex flex-column min-vh-100">
    {% block 'header' %}
    {% include 'header.html' %}
    {% endblock %}

    {% block 'navbar' %}
    {% include 'navbar.html' %}
    {% endblock %}

    {% block 'content' %}
    
    {% endblock %}

    {% block 'footer' %}
    {% include 'footer.html' %}
    {% endblock %}
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
